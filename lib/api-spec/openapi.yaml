openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: GTR CUBAUTO API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: products
  - name: wholesale
  - name: discounts
  - name: orders
  - name: dashboard
  - name: customers
  - name: wholesale-customers
  - name: quote-whatsapps
  - name: Storage

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List all products
      responses:
        "200":
          description: Product list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /products/{id}:
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /products/{id}/price:
    patch:
      operationId: updateProductPrice
      tags: [products]
      summary: Update retail and wholesale price for a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceUpdate"
      responses:
        "200":
          description: Price updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /wholesale/products:
    get:
      operationId: listWholesaleProducts
      tags: [wholesale]
      summary: List products with wholesale pricing and tiers
      responses:
        "200":
          description: Wholesale product list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WholesaleProduct"

  /discounts:
    get:
      operationId: listDiscounts
      tags: [discounts]
      summary: List all discount rules
      responses:
        "200":
          description: Discount list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Discount"
    post:
      operationId: createDiscount
      tags: [discounts]
      summary: Create a discount rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscountInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Discount"

  /discounts/{id}:
    patch:
      operationId: updateDiscount
      tags: [discounts]
      summary: Update a discount rule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscountUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Discount"
    delete:
      operationId: deleteDiscount
      tags: [discounts]
      summary: Delete a discount rule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List all orders
      responses:
        "200":
          description: Order list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create an order (purchase)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /quote-whatsapps:
    get:
      operationId: listQuoteWhatsapps
      tags: [quote-whatsapps]
      summary: List WhatsApp numbers used for cart quote requests
      responses:
        "200":
          description: Quote WhatsApp number list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuoteWhatsapp"
    put:
      operationId: replaceQuoteWhatsapps
      tags: [quote-whatsapps]
      summary: Replace the full list of quote WhatsApp numbers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteWhatsappsReplace"
      responses:
        "200":
          description: Updated list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuoteWhatsapp"

  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      summary: List all registered customers
      responses:
        "200":
          description: Customer list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"
    post:
      operationId: createCustomer
      tags: [customers]
      summary: Register a new customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "201":
          description: Customer registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

  /customers/{id}:
    delete:
      operationId: deleteCustomer
      tags: [customers]
      summary: Delete a customer record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /wholesale-customers:
    get:
      operationId: listWholesaleCustomers
      tags: [wholesale-customers]
      summary: List all wholesale registered customers
      responses:
        "200":
          description: Wholesale customer list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WholesaleCustomerRecord"
    post:
      operationId: registerWholesaleCustomer
      tags: [wholesale-customers]
      summary: Register a new wholesale customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WholesaleCustomerInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WholesaleCustomerRecord"

  /wholesale-customers/{id}:
    delete:
      operationId: deleteWholesaleCustomer
      tags: [wholesale-customers]
      summary: Delete a wholesale customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /customers/campaign:
    post:
      operationId: sendCampaign
      tags: [customers]
      summary: Log a campaign send to a customer segment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignInput"
      responses:
        "200":
          description: Campaign logged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignResult"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary metrics
      responses:
        "200":
          description: Dashboard metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    Product:
      type: object
      required: [id, name, price, stock, image, wholesalePrice, minWholesaleQty, category]
      properties:
        id:
          type: integer
        name:
          type: string
        price:
          type: number
          description: Retail price
        wholesalePrice:
          type: number
          description: Wholesale price per unit
        minWholesaleQty:
          type: integer
          description: Minimum quantity for wholesale price
        stock:
          type: integer
        image:
          type: string
        category:
          type: string
        description:
          type: ["string", "null"]

    ProductInput:
      type: object
      required: [name, price, wholesalePrice, minWholesaleQty, stock, image, category]
      properties:
        name:
          type: string
        price:
          type: number
        wholesalePrice:
          type: number
        minWholesaleQty:
          type: integer
        stock:
          type: integer
        image:
          type: string
        category:
          type: string
        description:
          type: string

    ProductUpdate:
      type: object
      properties:
        name:
          type: string
        price:
          type: number
        wholesalePrice:
          type: number
        minWholesaleQty:
          type: integer
        stock:
          type: integer
        image:
          type: string
        category:
          type: string
        description:
          type: string

    PriceUpdate:
      type: object
      properties:
        price:
          type: number
        wholesalePrice:
          type: number
        minWholesaleQty:
          type: integer

    WholesaleProduct:
      type: object
      required: [id, name, price, wholesalePrice, minWholesaleQty, stock, image, category, tiers]
      properties:
        id:
          type: integer
        name:
          type: string
        price:
          type: number
        wholesalePrice:
          type: number
        minWholesaleQty:
          type: integer
        stock:
          type: integer
        image:
          type: string
        category:
          type: string
        tiers:
          type: array
          items:
            $ref: "#/components/schemas/PriceTier"

    PriceTier:
      type: object
      required: [minQty, price, label]
      properties:
        minQty:
          type: integer
        price:
          type: number
        label:
          type: string

    Discount:
      type: object
      required: [id, name, type, value, active, appliesTo, minAmount]
      properties:
        id:
          type: integer
        name:
          type: string
        code:
          type: ["string", "null"]
        type:
          type: string
          enum: [percentage, fixed, wholesale_tier]
        value:
          type: number
          description: Percentage (0-100) or fixed dollar amount
        active:
          type: boolean
        appliesTo:
          type: string
          enum: [all, retail, wholesale, category]
        category:
          type: ["string", "null"]
        minAmount:
          type: number
          description: Minimum order amount to apply discount
        expiresAt:
          type: ["string", "null"]

    DiscountInput:
      type: object
      required: [name, type, value, active, appliesTo, minAmount]
      properties:
        name:
          type: string
        code:
          type: string
        type:
          type: string
          enum: [percentage, fixed, wholesale_tier]
        value:
          type: number
        active:
          type: boolean
        appliesTo:
          type: string
          enum: [all, retail, wholesale, category]
        category:
          type: string
        minAmount:
          type: number
        expiresAt:
          type: string

    DiscountUpdate:
      type: object
      properties:
        name:
          type: string
        code:
          type: string
        type:
          type: string
          enum: [percentage, fixed, wholesale_tier]
        value:
          type: number
        active:
          type: boolean
        appliesTo:
          type: string
          enum: [all, retail, wholesale, category]
        category:
          type: string
        minAmount:
          type: number
        expiresAt:
          type: string

    Order:
      type: object
      required: [id, clientName, items, total, type, status, createdAt]
      properties:
        id:
          type: integer
        clientName:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        total:
          type: number
        type:
          type: string
          enum: [retail, wholesale]
        status:
          type: string
          enum: [pending, completed, cancelled]
        discountApplied:
          type: ["number", "null"]
        createdAt:
          type: string

    OrderItem:
      type: object
      required: [productId, productName, qty, unitPrice]
      properties:
        productId:
          type: integer
        productName:
          type: string
        qty:
          type: integer
        unitPrice:
          type: number

    OrderInput:
      type: object
      required: [clientName, items, type]
      properties:
        clientName:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        type:
          type: string
          enum: [retail, wholesale]
        discountCode:
          type: string

    QuoteWhatsapp:
      type: object
      required: [id, label, number]
      properties:
        id:
          type: integer
        label:
          type: string
        number:
          type: string

    QuoteWhatsappInput:
      type: object
      required: [number]
      properties:
        label:
          type: string
        number:
          type: string

    QuoteWhatsappsReplace:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/QuoteWhatsappInput"

    Customer:
      type: object
      required: [id, name, phone, email, province, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        province:
          type: string
        createdAt:
          type: string

    CustomerInput:
      type: object
      required: [name, phone, email, province]
      properties:
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        province:
          type: string

    CampaignInput:
      type: object
      required: [message, provinces]
      properties:
        message:
          type: string
        provinces:
          type: array
          items:
            type: string

    CampaignResult:
      type: object
      required: [sent, recipients]
      properties:
        sent:
          type: integer
        recipients:
          type: array
          items:
            type: string

    WholesaleCustomerRecord:
      type: object
      required: [id, name, phone, email, province, companyType, companyName, onatDocument, clientCode, clientNumber, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        province:
          type: string
        companyType:
          type: string
        companyName:
          type: string
        onatDocument:
          type: string
        onatPhotoPath:
          type: string
          nullable: true
        clientCode:
          type: string
        clientNumber:
          type: integer
        createdAt:
          type: string

    WholesaleCustomerInput:
      type: object
      required: [name, phone, email, province, companyType, companyName, onatDocument]
      properties:
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        province:
          type: string
        companyType:
          type: string
        companyName:
          type: string
        onatDocument:
          type: string
        onatPhotoPath:
          type: string
          nullable: true

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    DashboardSummary:
      type: object
      required: [totalRevenue, totalOrders, totalRetailOrders, totalWholesaleOrders, totalStock, lowStockCount, activeDiscounts, revenueToday]
      properties:
        totalRevenue:
          type: number
        totalOrders:
          type: integer
        totalRetailOrders:
          type: integer
        totalWholesaleOrders:
          type: integer
        totalStock:
          type: integer
        lowStockCount:
          type: integer
        activeDiscounts:
          type: integer
        revenueToday:
          type: number
